<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galeria Supercar – Generator de albume foto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #e8e7e3;
            --ink: #1c1e21;
            --mute: #6b6e72;
            --line: #c9c8c3;
            --red: #c8102e;
            --card: #f6f5f2
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #1a1b1d;
                --ink: #ecebe7;
                --mute: #9a9da1;
                --line: #35373a;
                --card: #232426
            }
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.55 "Work Sans", system-ui, sans-serif
        }

        header {
            padding: 56px 6vw 28px;
            border-bottom: 4px solid var(--red)
        }

        h1 {
            font: 900 clamp(48px, 11vw, 150px)/.88 "Big Shoulders Display", Impact, sans-serif;
            margin: 0;
            letter-spacing: -.01em;
            text-transform: uppercase
        }

        header p {
            max-width: 56ch;
            color: var(--mute);
            margin: 18px 0 0
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 20px 6vw;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg);
            z-index: 5;
            border-bottom: 1px solid var(--line)
        }

        nav button,
        .btn {
            font: 600 15px "Work Sans", sans-serif;
            border: 1.5px solid var(--ink);
            background: transparent;
            color: var(--ink);
            padding: 9px 16px;
            border-radius: 2px;
            cursor: pointer
        }

        nav button[aria-pressed=true] {
            background: var(--ink);
            color: var(--bg)
        }

        nav .sp {
            flex: 1
        }

        .btn.red {
            background: var(--red);
            border-color: var(--red);
            color: #fff
        }

        button:focus-visible,
        input:focus-visible,
        label:focus-within {
            outline: 3px solid var(--red);
            outline-offset: 2px
        }

        main {
            padding: 28px 6vw 80px
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px
        }

        .bar h2 {
            font: 900 40px/1 "Big Shoulders Display", Impact, sans-serif;
            margin: 0;
            text-transform: uppercase
        }

        .bar span {
            color: var(--mute)
        }

        .album {
            display: contents
        }

        .album[hidden] {
            display: none
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px
        }

        figure {
            margin: 0;
            background: var(--card);
            position: relative;
            cursor: zoom-in;
            aspect-ratio: 4/3;
            overflow: hidden;
            border: 1px solid var(--line)
        }

        figure img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .35s
        }

        figure:hover img {
            transform: scale(1.04)
        }

        figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, .7))
        }

        figure .del {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, .65);
            color: #fff;
            border: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px
        }

        .empty {
            padding: 60px 0;
            color: var(--mute)
        }

        dialog {
            border: 0;
            padding: 0;
            background: transparent;
            max-width: 100vw;
            max-height: 100vh;
            width: 100%;
            height: 100%
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, .92)
        }

        .lb {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #fff;
            gap: 12px;
            padding: 20px
        }

        .lb img {
            max-width: 92vw;
            max-height: 78vh;
            object-fit: contain
        }

        .lb .row {
            display: flex;
            gap: 10px
        }

        .lb button {
            background: #fff;
            color: #000;
            border: 0;
            padding: 10px 18px;
            font: 600 15px "Work Sans", sans-serif;
            cursor: pointer;
            border-radius: 2px
        }

        .modal {
            background: var(--card);
            color: var(--ink);
            padding: 24px;
            max-width: 380px;
            margin: auto;
            border-radius: 2px
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin: 10px 0 16px;
            font: inherit;
            border: 1.5px solid var(--ink);
            background: var(--bg);
            color: var(--ink)
        }

        footer {
            padding: 24px 6vw;
            color: var(--mute);
            border-top: 1px solid var(--line);
            font-size: 14px
        }

        @media (prefers-reduced-motion:reduce) {
            figure img {
                transition: none
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Supercar<br>Albume</h1>
        <p>Generator de albume foto pentru mașini exotice. Alege un album, adaugă fotografiile tale sau creează un album
            nou.</p>
    </header>
    <nav id="tabs" aria-label="Albume"></nav>
    <main>
        <div class="bar">
            <h2 id="title"></h2><span id="count"></span>
        </div>
        <div class="grid" id="grid">
            <section class="album" data-name="Porsche">
                <figure><img

                    <figcaption>Porsche 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/2017_Porsche_911_GT3_2.jpg/960px-2017_Porsche_911_GT3_2.jpg"
                        alt="Porsche 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Porsche 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/2017_Porsche_911_GT3_3.jpg/960px-2017_Porsche_911_GT3_3.jpg"
                        alt="Porsche 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Porsche 3</figcaption>
                </figure>
                <figure><img

                    <figcaption>Porsche 4</figcaption>
                </figure>
            </section>
            <section class="album" data-name="Lamborghini" hidden>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Lamborghini_Huracan_(1).JPG/960px-Lamborghini_Huracan_(1).JPG"
                        alt="Lamborghini 1" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Lamborghini 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Lamborghini_Huracan_(2).JPG/960px-Lamborghini_Huracan_(2).JPG"
                        alt="Lamborghini 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Lamborghini 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Lamborghini_Huracan_(3).JPG/960px-Lamborghini_Huracan_(3).JPG"
                        alt="Lamborghini 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Lamborghini 3</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Lamborghini_Huracan.JPG/960px-Lamborghini_Huracan.JPG"
                        alt="Lamborghini 4" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Lamborghini 4</figcaption>
                </figure>
            </section>
            <section class="album" data-name="Ferrari" hidden>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/2017_Ferrari_488_GTB_(1).jpg/960px-2017_Ferrari_488_GTB_(1).jpg"
                        alt="Ferrari 1" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Ferrari 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/2017_Ferrari_488_GTB_(2).jpg/960px-2017_Ferrari_488_GTB_(2).jpg"
                        alt="Ferrari 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Ferrari 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/2017_Ferrari_488_GTB_Automatic_3.9_Front.jpg/960px-2017_Ferrari_488_GTB_Automatic_3.9_Front.jpg"
                        alt="Ferrari 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Ferrari 3</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/2018_Ferrari_488_GTB.jpg/960px-2018_Ferrari_488_GTB.jpg"
                        alt="Ferrari 4" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Ferrari 4</figcaption>
                </figure>
            </section>
            <section class="album" data-name="McLaren" hidden>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/2013_McLaren_P1_XP05.jpg/960px-2013_McLaren_P1_XP05.jpg"
                        alt="McLaren 1" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>McLaren 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/2014_McLaren_P1_HDK.jpg/960px-2014_McLaren_P1_HDK.jpg"
                        alt="McLaren 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>McLaren 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/2014_McLaren_P1_HDK_Side.jpg/960px-2014_McLaren_P1_HDK_Side.jpg"
                        alt="McLaren 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>McLaren 3</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/2019_McLaren_720S_LC24.jpg/960px-2019_McLaren_720S_LC24.jpg"
                        alt="McLaren 4" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>McLaren 4</figcaption>
                </figure>
            </section>
            <section class="album" data-name="Bugatti" hidden>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/2018_Bugatti_Chiron_1.jpg/960px-2018_Bugatti_Chiron_1.jpg"
                        alt="Bugatti 1" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Bugatti 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/eb/2018_Bugatti_Chiron_2.jpg/960px-2018_Bugatti_Chiron_2.jpg"
                        alt="Bugatti 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Bugatti 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/2018_Bugatti_Chiron_3.jpg/960px-2018_Bugatti_Chiron_3.jpg"
                        alt="Bugatti 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Bugatti 3</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/2018_Bugatti_Chiron_4.jpg/960px-2018_Bugatti_Chiron_4.jpg"
                        alt="Bugatti 4" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Bugatti 4</figcaption>
                </figure>
            </section>
            <section class="album" data-name="Aston Martin" hidden>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Aston_Martin_DB11_1.jpg/960px-Aston_Martin_DB11_1.jpg"
                        alt="Aston Martin 1" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Aston Martin 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Aston_Martin_DB11_2.jpg/960px-Aston_Martin_DB11_2.jpg"
                        alt="Aston Martin 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Aston Martin 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b2/Aston_Martin_DB11_3.jpg/960px-Aston_Martin_DB11_3.jpg"
                        alt="Aston Martin 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Aston Martin 3</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Aston_Martin_DB11_4.jpg/960px-Aston_Martin_DB11_4.jpg"
                        alt="Aston Martin 4" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Aston Martin 4</figcaption>
                </figure>
            </section>
            <section class="album" data-name="Koenigsegg" hidden>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9b/2023_Koenigsegg_Jesko_LC24.jpg/960px-2023_Koenigsegg_Jesko_LC24.jpg"
                        alt="Koenigsegg 1" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Koenigsegg 1</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/2023_Koenigsegg_Jesko_Driving_LC24.jpg/960px-2023_Koenigsegg_Jesko_Driving_LC24.jpg"
                        alt="Koenigsegg 2" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Koenigsegg 2</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/2023_Koenigsegg_Jesko_LC24_Low.jpg/960px-2023_Koenigsegg_Jesko_LC24_Low.jpg"
                        alt="Koenigsegg 3" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Koenigsegg 3</figcaption>
                </figure>
                <figure><img
                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/d/db/2019_Koenigsegg_Regera_LC24.jpg/960px-2019_Koenigsegg_Regera_LC24.jpg"
                        alt="Koenigsegg 4" loading="lazy" referrerpolicy="no-referrer">
                    <figcaption>Koenigsegg 4</figcaption>
                </figure>
            </section>
        </div>
    </main>
    <footer>Proiect individual – Generator de albume cu fotografii</footer>

    <dialog id="lb">
        <div class="lb">
            <img id="lbimg" alt="">
            <div id="lbcap"></div>
            <div class="row"><button id="prev">Înapoi</button><button id="next">Înainte</button><button
                    id="close">Închide</button></div>
        </div>
    </dialog>

    <dialog id="newAlbum">
        <form method="dialog" class="modal" id="albumForm">
            <h3 style="margin:0">Album nou</h3>
            <label for="albumName">Numele albumului (ex: McLaren)</label>
            <input id="albumName" required maxlength="30">
            <div style="display:flex;gap:8px;justify-content:flex-end">
                <button type="button" class="btn" id="cancelAlbum">Anulează</button>
                <button class="btn red" value="ok">Creează album</button>
            </div>
        </form>
    </dialog>

    <input type="file" id="file" accept="image/*" multiple hidden>

    <script>
        const $ = id => document.getElementById(id);
        const grid = $("grid"); let current = "Porsche", idx = 0;
        const sec = n => [...grid.querySelectorAll(".album")].find(s => s.dataset.name === n);
        const figs = () => [...sec(current).querySelectorAll("figure")];
        const ph = name => "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#8a8d91"/><text x="400" y="310" font-family="sans-serif" font-size="34" fill="#fff" text-anchor="middle">${name}</text></svg>`);
        function wire(f) {
            const im = f.querySelector("img");
            im.onerror = () => { im.onerror = null; im.src = ph(im.alt) };
            f.onclick = () => { idx = figs().indexOf(f); show(); $("lb").showModal() };
        }
        function render() {
            const tabs = $("tabs"); tabs.innerHTML = "";
            [...grid.querySelectorAll(".album")].forEach(s => {
                const n = s.dataset.name, b = document.createElement("button");
                b.textContent = n; b.setAttribute("aria-pressed", n === current);
                b.onclick = () => { current = n; render() }; tabs.appendChild(b);
                s.hidden = n !== current;
            });
            const sp = document.createElement("span"); sp.className = "sp"; tabs.appendChild(sp);
            const add = document.createElement("button"); add.className = "btn red"; add.textContent = "Adaugă poze";
            add.onclick = () => $("file").click(); tabs.appendChild(add);
            const na = document.createElement("button"); na.textContent = "Album nou";
            na.onclick = () => $("newAlbum").showModal(); tabs.appendChild(na);
            $("title").textContent = current; $("count").textContent = figs().length + " fotografii";
        }
        function show() {
            const f = figs()[idx], im = f.querySelector("img"), box = $("lbimg");
            box.onerror = () => { box.onerror = null; box.src = ph(im.alt) };
            box.src = im.currentSrc || im.src; box.alt = im.alt; $("lbcap").textContent = `${im.alt} (${idx + 1}/${figs().length})`;
        }
        const step = d => { const n = figs().length; idx = (idx + d + n) % n; show() };
        $("prev").onclick = () => step(-1); $("next").onclick = () => step(1); $("close").onclick = () => $("lb").close();
        $("lb").addEventListener("keydown", e => { if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1) });
        function addFig(src, name) {
            const f = document.createElement("figure");
            f.innerHTML = `<img alt="${name}"><figcaption>${name}</figcaption><button class="del" aria-label="Șterge poza">×</button>`;
            f.querySelector("img").src = src;
            f.querySelector(".del").onclick = e => { e.stopPropagation(); f.remove(); render() };
            sec(current).appendChild(f); wire(f);
        }
        $("file").onchange = e => { [...e.target.files].forEach(f => addFig(URL.createObjectURL(f), f.name.replace(/\.[^.]+$/, ""))); e.target.value = ""; render() };
        $("albumForm").onsubmit = () => {
            const n = $("albumName").value.trim();
            if (n && !sec(n)) { const s = document.createElement("section"); s.className = "album"; s.dataset.name = n; grid.appendChild(s); current = n; render() }
            $("albumName").value = "";
        };
        $("cancelAlbum").onclick = () => $("newAlbum").close();
        grid.querySelectorAll("figure").forEach(wire);
        render();
    </script>
</body>

</html>
